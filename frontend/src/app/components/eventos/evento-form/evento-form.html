<div class="container">
  <h2>{{ idEdicao ? 'Editar Evento' : 'Novo Evento' }}</h2>

  <form #eventoForm="ngForm" (ngSubmit)="salvar()">
    <div class="campo">
      <label>Título: *</label>
      <input type="text" name="titulo" [(ngModel)]="evento().titulo" required />
    </div>

    <div class="campo">
      <label>Descrição:</label>
      <input type="text" name="descricao" [(ngModel)]="evento().descricao" />
    </div>

    <div class="campo">
      <label>Data: *</label>
      <input type="date" name="data" [(ngModel)]="evento().data" required />
    </div>

    <div class="campo">
      <label>Local: *</label>
      <input type="text" name="local" [(ngModel)]="evento().local" required />
    </div>

    <div class="campo">
      <label>Organizador:</label>
      <input type="text" name="organizador" [(ngModel)]="evento().organizador" />
    </div>

    <div class="campo">
      <label>Capacidade:</label>
      <input type="number" name="capacidade" [(ngModel)]="evento().capacidade" />
    </div>

    <div class="campo">
      <label>Categoria:</label>
      <input type="text" name="categoria" [(ngModel)]="evento().categoria" />
    </div>

    <div class="acoes">
      <button type="submit" [disabled]="eventoForm.invalid">Salvar</button>
      <button type="button" (click)="voltar()">Cancelar</button>
    </div>
  </form>
</div>
