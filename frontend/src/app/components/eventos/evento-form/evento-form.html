<div class="container">
  <div class="cabecalho">
    <h2>{{ idEdicao ? 'Editar Evento' : 'Novo Evento' }}</h2>
    <p class="subtitulo">
      {{ idEdicao ? 'Atualize as informações do evento abaixo' : 'Preencha os dados para cadastrar um novo evento' }}
    </p>
  </div>

  <form #eventoForm="ngForm" (ngSubmit)="salvar()">
    <div class="grid-form">
      <div class="campo span-2">
        <label for="titulo">Título *</label>
        <input
          id="titulo"
          type="text"
          name="titulo"
          placeholder="Ex: Workshop de Angular"
          [(ngModel)]="evento().titulo"
          required
        />
      </div>

      <div class="campo span-2">
        <label for="descricao">Descrição</label>
        <textarea
          id="descricao"
          name="descricao"
          rows="3"
          placeholder="Breve resumo sobre o evento..."
          [(ngModel)]="evento().descricao"
        ></textarea>
      </div>

      <div class="campo">
        <label for="data">Data *</label>
        <input
          id="data"
          type="date"
          name="data"
          [(ngModel)]="evento().data"
          required
        />
      </div>

      <div class="campo">
        <label for="local">Local *</label>
        <input
          id="local"
          type="text"
          name="local"
          placeholder="Ex: Auditório Principal"
          [(ngModel)]="evento().local"
          required
        />
      </div>

      <div class="campo">
        <label for="organizador">Organizador</label>
        <input
          id="organizador"
          type="text"
          name="organizador"
          placeholder="Nome do responsável"
          [(ngModel)]="evento().organizador"
        />
      </div>

      <div class="campo">
        <label for="capacidade">Capacidade</label>
        <input
          id="capacidade"
          type="number"
          name="capacidade"
          placeholder="Ex: 100"
          [(ngModel)]="evento().capacidade"
        />
      </div>

      <div class="campo span-2">
        <label for="categoria">Categoria</label>
        <input
          id="categoria"
          type="text"
          name="categoria"
          placeholder="Ex: Tecnologia, Negócios, Workshop"
          [(ngModel)]="evento().categoria"
        />
      </div>
    </div>

    <div class="acoes">
      <button type="button" class="btn-cancelar" (click)="voltar()">Cancelar</button>
      <button type="submit" class="btn-salvar" [disabled]="eventoForm.invalid">
        {{ idEdicao ? 'Atualizar Evento' : 'Salvar Evento' }}
      </button>
    </div>
  </form>
</div>
